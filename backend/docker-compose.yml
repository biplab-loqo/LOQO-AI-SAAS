version: '3.8'

services:
  mongodb:
    image: mongo:7
    container_name: loqo-mongo
    restart: unless-stopped
    ports:
      - "27018:27017"
    environment:
      MONGO_INITDB_ROOT_USERNAME: loqo
      MONGO_INITDB_ROOT_PASSWORD: loqo123
      MONGO_INITDB_DATABASE: loqo_db
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - loqo-network

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local

networks:
  loqo-network:
    driver: bridge
